# Core configuration for the options bot.
# Sensitive values (API keys) live in .env, not here.

account:
  # Balance used for position-size caps.
  balance: 1000
  # false = always size off the `balance` above, ignoring what's actually in
  # the broker account. Deliberately set for the sandbox trial: the sandbox
  # account holds Tradier's default fake $100,000, but sizing should reflect
  # the user's real ~$1,000 cash, not the sandbox's play money.
  use_live_balance: false

  # Never risk more than this fraction of account balance on a single trade.
  # 0.35 is a deliberately aggressive setting (confirmed choice, not a
  # conservative default) -- on a $1,000 account that's up to $350 at risk
  # per trade. See README's Backtesting section for how this compares to a
  # tighter 5% cap.
  max_risk_pct_per_trade: 0.35

  # Halt all new entries for the rest of the day once realized loss for the
  # day reaches this fraction of account balance.
  daily_loss_limit_pct: 0.10

  max_concurrent_positions: 3
  max_trades_per_day: 8

broker:
  # paper = Tradier sandbox (fake fills, safe to experiment).
  # live  = real orders with real money. Only switch this after you have
  #         watched the bot trade paper for a while and reviewed its logs.
  mode: paper

trading_window:
  timezone: America/New_York
  start: "09:35"
  end: "15:55"
  poll_interval_seconds: 10

news_agent:
  enabled: true
  vix_symbol: VIX
  # VIX level at/above which the day is flagged cautious.
  vix_caution_level: 25
  # Percent jump in VIX vs prior close that also flags the day cautious.
  vix_caution_change_pct: 8
  econ_calendar_enabled: true
  # High-impact event keywords that flag the day cautious if scheduled today.
  high_impact_events:
    - FOMC
    - CPI
    - "Non-Farm Payroll"
    - NFP
    - PCE
    - "Fed Chair"
    - GDP
  llm_sentiment_enabled: true
  # How much of a haircut cautious-day trades get. 0.5 = half the contracts,
  # matching the "half as many contracts on cautious days" behavior.
  cautious_contract_multiplier: 0.5
  # Re-run the news/VIX check this often during the day (VIX can move fast).
  reassess_interval_minutes: 30

strategies:
  # Filenames (without .py) of strategy plugins to load from src/strategies/.
  active:
    - orb
    - support_resistance
  # Symbols each active strategy is scanned against.
  #
  # Selected from the backtest analysis: symbols that were net-positive
  # (corrected PnL) across all three timeframes tested (5m/60d, 1m/7d,
  # 60m/1y) for ALL THREE strategies active at the time of selection
  # (no_wick_candles, orb, support_resistance) -- the strictest
  # cross-strategy consistency bar reached this session, not just a good
  # result for one. Ranked by combined corrected-PnL magnitude across those
  # 3 strategies x 3 timeframes among that qualifying set. WMT (the
  # weakest of the 5) was dropped when no_wick_candles was removed from
  # active -- left as-is rather than re-run against just the remaining 2
  # strategies.
  #
  # Count is rate-limit-driven, not arbitrary: at 10s polling and Tradier's
  # measured 200 req/min sandbox limit, each symbol costs ~24 req/min
  # (4 calls/poll x 6 polls/min) plus up to ~18 req/min shared overhead for
  # concurrent-position exit checks (capped at max_concurrent_positions).
  # That caps this list at 7 symbols to stay under the limit; 4 here
  # leaves a 3-symbol margin for error.
  underlyings:
    - META
    - MSFT
    - GOOGL
    - AAPL
